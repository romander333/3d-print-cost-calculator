databaseChangeLog:
  - changeSet:
      id: 2
      author: luchko roman
      changes:
        - createTable:
            tableName: spools
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: material_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: DECIMAL
                  constraints:
                    nullable: false
              - column:
                  name: current_weight
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: initial_weight
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: purchase_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValue: true
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: spools
            baseColumnNames: material_id
            constraintName: fk_spools_material
            referencedTableName: materials
            referencedColumnNames: id
            onDelete: CASCADE