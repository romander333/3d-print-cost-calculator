databaseChangeLog:
  - changeSet:
      id: 1
      author: luchko roman
      changes:
        - createTable: 
            tableName: materials
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: material_type
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: price
                  type: DECIMAL
                  constraints:
                    nullable: false
              - column:
                  name: weight
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: filament_diameter
                  type: DOUBLE
                  defaultValue: 1.75
                  constraints:
                    nullable: false
              - column:
                  name: density
                  type: DOUBLE
                  constraints:
                    nullable: false
              - column:
                  name: color
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: manufacturer
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValue: true
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValue: false
